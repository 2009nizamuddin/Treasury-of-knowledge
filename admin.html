<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন · খাযানাতুল মা’রিফা</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f0d;--card:#151a18;--field:#1d2220;--line:#2d3532;--text:#f1f3f0;--muted:#8f9b95;--gold:#c9a15a;--ok:#7fd8a8;--err:#ff8a7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#1f2a25,var(--bg));color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.55;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ar{font-family:Amiri,serif;color:var(--gold);font-size:1.5rem;line-height:1.4;margin:0}
.bn{margin:0;font-weight:600;font-size:.95rem}
.btn{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:linear-gradient(90deg,#3a403d,var(--gold) 90%);border:0;color:#fff}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;font-size:1rem;margin-bottom:10px}
.in:focus{outline:2px solid var(--gold)}
.hide{display:none}
.tabs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto}
.tab{flex:0 0 auto;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--text);font:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:#111;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--muted);font-size:.85rem;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:1.3em;font-size:.9rem;margin:8px 0}
</style></head><body><div class="wrap">
<div class="top"><div><p class="ar" lang="ar" dir="rtl">خَزَانَةُ المَعْرِفَة</p><p class="bn">অ্যাডমিন · আপলোড</p></div><a class="btn" href="home.html">← হোম</a></div>
<div id="deny" class="card hide">এই পেজে প্রবেশের অনুমতি আপনার নেই।</div>
<div id="av" class="hide">
<div class="card"><form id="frm">
<input class="in" id="title" placeholder="শিরোনাম" autocomplete="off">
<select class="in" id="kind"><option value="note">নোট</option><option value="book">বই</option></select>
<select class="in" id="cat"></select>
<input class="in" id="file" type="file" accept=".pdf,.doc,.docx,.txt,.epub,image/*">
<button class="btn g" id="go" type="submit" style="width:100%">আপলোড করুন</button>
<p class="msg" id="msg" role="status"></p></form></div>
<h3 style="margin:20px 0 0">সাম্প্রতিক ফাইল</h3><div id="list"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb=window.supabase.createClient("https://jlkyzwqnieknswawveua.supabase.co","sb_publishable_63D7T265mnvAsqB2n5o0CA_aYuSfeBk");
var CATS=["কুরআন ও তাফসীর","হাদীস","ফিকহ","আকীদা","সীরাত","আরবি ভাষা","ইতিহাস","সাধারণ জ্ঞান","অন্যান্য"];
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function meta(it){return (it.kind==="book"?"বই":"নোট")+" · "+it.category+" · "+new Date(it.created_at).toLocaleDateString("bn-BD")}
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")location.replace("index.html")});

function say(t,ok){var m=$("msg");m.textContent=t;m.style.color=ok?"var(--ok)":"var(--err)"}
async function load(){
var r=await sb.from("items").select("*").order("created_at",{ascending:false}),L=$("list");L.innerHTML="";
(r.data||[]).forEach(function(it){
var d=el("div","card");d.appendChild(el("h3","",it.title));d.appendChild(el("div","meta",meta(it)));
var b=el("button","btn","মুছুন");
b.onclick=async function(){
if(!confirm("“"+it.title+"” মুছে ফেলবেন?"))return;
await sb.storage.from("library").remove([it.file_path]);
await sb.from("items").delete().eq("id",it.id);load()};
d.appendChild(b);L.appendChild(d)})}
async function init(){
var s=await sb.auth.getSession();
if(!s.data.session){location.replace("index.html");return}
var a=await sb.from("admins").select("user_id").eq("user_id",s.data.session.user.id).maybeSingle();
if(!a.data){$("deny").classList.remove("hide");return}
$("av").classList.remove("hide");
CATS.forEach(function(x){var p=el("option","",x);p.value=x;$("cat").appendChild(p)});
load()}
$("frm").onsubmit=async function(e){
e.preventDefault();
var t=$("title").value.trim(),f=$("file").files[0];
if(t.length<2)return say("শিরোনাম লিখুন");
if(!f)return say("ফাইল বাছাই করুন");
if(f.size>50*1024*1024)return say("ফাইল ৫০ মেগাবাইটের বেশি হতে পারবে না");
var ext=((f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8))||"bin";
var path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
$("go").disabled=true;say("আপলোড হচ্ছে, অপেক্ষা করুন…",true);
var u=await sb.storage.from("library").upload(path,f,{contentType:f.type||"application/octet-stream"});
if(u.error){$("go").disabled=false;return say("আপলোড হয়নি: "+u.error.message)}
var i=await sb.from("items").insert({title:t,kind:$("kind").value,category:$("cat").value,file_path:path,file_name:f.name});
if(i.error){await sb.storage.from("library").remove([path]);$("go").disabled=false;return say("সংরক্ষণ হয়নি: "+i.error.message)}
say("আপলোড সম্পন্ন ✓",true);$("frm").reset();$("go").disabled=false;load()};

init();
</script></body></html>
